name: Weekly EIA Realized Price Backfill

on:
  schedule:
    # FRED normally reflects Monday's EIA observation by Wednesday.
    - cron: "0 13 * * 3"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Audit without writing"
        required: false
        default: false
        type: boolean
      force:
        description: "Recheck already realized eligible rows"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: gas-price-production
  cancel-in-progress: false

env:
  GASPRICE_ROOT: ${{ github.workspace }}
  GASPRICE_PIPELINE_RUN_ID: ${{ github.run_id }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  backfill:
    name: Backfill exact-target realized evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-backfill-lock.txt

      - name: Install locked backfill dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-backfill-lock.txt

      - name: Validate inputs
        id: precheck
        run: |
          set -euo pipefail
          if [ ! -s artifacts_part3/prediction_log.csv ]; then
            echo "::notice::No prediction ledger exists yet."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${FRED_API_KEY}" ] && [ -z "${EIA_API_KEY}" ]; then
            echo "::error::FRED_API_KEY or EIA_API_KEY is required."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Backfill exact target observations
        if: steps.precheck.outputs.run == 'true'
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then args+=(--dry-run); fi
          if [ "${{ inputs.force || false }}" = "true" ]; then args+=(--force); fi
          python gas_backfill_realized.py "${args[@]}"

      - name: Recompute eligible live attribution
        if: steps.precheck.outputs.run == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          python gas_part9_live_attribution.py
          python gas_release_manifest.py backfill
          python gas_release_manifest.py verify

      - name: Upload immutable backfill evidence
        if: steps.precheck.outputs.run == 'true' && inputs.dry_run != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gas-price-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            artifacts_part3/prediction_log.csv
            artifacts_part9/live_attribution_report.json
            artifacts_part9/live_attribution_tape.csv
            data/release_manifest.json

      - name: Commit realized-evidence surface
        id: publish
        if: steps.precheck.outputs.run == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            artifacts_part3/prediction_log.csv \
            artifacts_part9/live_attribution_report.json \
            artifacts_part9/live_attribution_tape.csv \
            data/prediction_log.csv \
            data/live_attribution_report.json \
            data/live_attribution_tape.csv \
            data/release_manifest.json

          if git diff --cached --quiet; then
            echo "No newly realized evidence to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Backfill eligible EIA observations (${{ github.run_id }})"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase --autostash "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy committed evidence to Pages
        if: steps.publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
