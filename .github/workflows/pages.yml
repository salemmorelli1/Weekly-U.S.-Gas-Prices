name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "report/**"
      - "data/**"
      - "artifacts_part2/**"
      - "artifacts_part2a/**"
      - "artifacts_part2b/**"
      - "artifacts_part3/**"
      - "artifacts_part6/**"
      - "artifacts_part9/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          if [ ! -f index.html ]; then
            echo "ERROR: index.html was not found at the repository root."
            exit 1
          fi
          cp index.html _site/index.html

          if [ -d assets ]; then
            cp -r assets _site/assets
          fi

          # Publish the APA report beside the interactive laboratory.
          if [ -d report ]; then
            cp -r report _site/report
          fi

          # Copy dashboard telemetry both under data/ and flat at the site root
          # so older and newer index builds resolve the same committed files.
          if [ -d data ]; then
            cp -r data _site/data
            cp data/* _site/ 2>/dev/null || true
          fi

          for f in \
            artifacts_part2/gas_part2_summary.json \
            artifacts_part2/gas_forecast_tape.csv \
            artifacts_part2b/gas_part2b_summary.json \
            artifacts_part2a/gas_part2a_summary.json \
            artifacts_part3/gas_part3_summary.json \
            artifacts_part3/prediction_log.csv \
            artifacts_part6/gas_regime_meta.json \
            artifacts_part9/live_attribution_report.json
          do
            if [ -f "$f" ] && [ ! -f "_site/$(basename "$f")" ]; then
              cp "$f" _site/
              echo "Staged from artifacts: $f"
            fi
          done

          # The interactive Actual-vs.-Predicted explorer reads the complete
          # weekly tape from data/ while retaining the flat-path fallback.
          if [ -f artifacts_part2/gas_forecast_tape.csv ]; then
            mkdir -p _site/data
            cp artifacts_part2/gas_forecast_tape.csv _site/data/gas_forecast_tape.csv
          fi

          if [ -f favicon.ico ]; then
            cp favicon.ico _site/favicon.ico
          fi
          touch _site/.nojekyll
          echo "Prepared static site contents:"
          find _site -maxdepth 4 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
