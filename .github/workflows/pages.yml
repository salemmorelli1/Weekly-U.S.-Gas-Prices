name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "report/**"
      - "data/**"
      - "artifacts_part2/**"
      - "artifacts_part2a/**"
      - "artifacts_part2b/**"
      - "artifacts_part3/**"
      - "artifacts_part6/**"
      - "artifacts_part9/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          if [ ! -f data/release_manifest.json ]; then
            echo "ERROR: data/release_manifest.json is required."
            exit 1
          fi

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("data/release_manifest.json").read_text())
          records = manifest.get("files", {})
          if not records:
              raise ValueError("release manifest has no files")
          listed = set(records)
          present = {
              path.name
              for path in Path("data").iterdir()
              if path.is_file() and path.name != "release_manifest.json"
          }
          if listed != present:
              raise ValueError(
                  "release manifest file set mismatch: "
                  f"missing={sorted(listed - present)}, "
                  f"unlisted={sorted(present - listed)}"
              )
          for filename, record in records.items():
              path = Path("data") / filename
              if not path.is_file():
                  raise FileNotFoundError(path)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != record.get("sha256"):
                  raise ValueError(f"release manifest mismatch: {path}")
          print("Release manifest verified before Pages publication.")
          PY

          if [ ! -f index.html ]; then
            echo "ERROR: index.html was not found at the repository root."
            exit 1
          fi
          cp index.html _site/index.html

          if [ -d assets ]; then
            cp -r assets _site/assets
          fi

          # Publish the APA report beside the interactive laboratory.
          if [ -d report ]; then
            cp -r report _site/report
          fi

          # Pages consumes only the content-hashed release surface. Never
          # overwrite it with an unmanifested artifact-directory fallback.
          cp -r data _site/data
          cp data/* _site/

          if [ -f favicon.ico ]; then
            cp favicon.ico _site/favicon.ico
          fi
          touch _site/.nojekyll
          echo "Prepared static site contents:"
          find _site -maxdepth 4 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
