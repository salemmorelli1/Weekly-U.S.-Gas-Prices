name: Release ledger controls

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  causal-controls:
    name: CPU pipeline verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-lock.txt

      - name: Install the tested CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements-ci-lock.txt
          python -m pip check
          python -c "import torch, xgboost; assert torch.version.cuda is None; print('CPU model dependencies available')"

      - name: Compile every tracked Python file
        run: |
          set -euo pipefail
          python -m py_compile $(git ls-files '*.py')

      - name: Run fatal-error lint checks
        run: |
          set -euo pipefail
          python -m ruff check --select E9,F63,F7,F82 .

      - name: Run regression and disposable pipeline tests
        run: |
          set -euo pipefail
          python -m pytest -q
          python gas_release_manifest.py verify

      - name: Replay backfill with only its production dependencies
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "backfill-runtime"
          subprocess.run([sys.executable, "-m", "venv", str(directory)], check=True)
          interpreter = directory / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run([str(interpreter), "-m", "pip", "install", "--disable-pip-version-check", "-r", "requirements-backfill-lock.txt"], check=True)
          subprocess.run([str(interpreter), "-m", "pip", "check"], check=True)
          subprocess.run([str(interpreter), "gas_replay_backfill.py", "--require-minimal"], check=True)
          PY

      - name: Parse workflow YAML
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              value = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise ValueError(f"workflow is not a mapping: {path}")
              print(f"parsed: {path}")
          PY

      - name: Verify published forecasts remained unchanged
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
