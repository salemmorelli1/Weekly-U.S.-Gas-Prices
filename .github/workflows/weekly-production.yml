name: Weekly Gas Price Forecast

# ─────────────────────────────────────────────────────────────────────────────
# Canonical weekly production pipeline for GasPriceForecast.
#
# FIX (Audit 2026-08): removed the non-functional `timezone` key from the
# schedule trigger.
#
# ROOT CAUSE (identical to PriceCall S60 finding)
# ────────────────────────────────────────────────
# The previous design used:
#
#     - cron: "35 10 * * 1"
#       timezone: "America/New_York"
#
# GitHub Actions schedule triggers on github.com do NOT support a `timezone`
# key. The field is silently ignored — the cron fired at 10:35 UTC, which is
# 6:35 AM EDT / 5:35 AM EST, HOURS BEFORE the Monday EIA weekly release
# (~9:00 AM ET). Every scheduled run fetched last week's stale data and the
# "this week" forecast row was anchored one week behind. workflow_dispatch
# runs were unaffected, masking the bug.
#
# SOLUTION
# ─────────
# The proven dual-cron UTC pattern from the reference project:
#   10:35 AM EDT (UTC-4, ~Mar–Nov) = 14:35 UTC  →  cron: "35 14 * * 1"
#   10:35 AM EST (UTC-5, ~Nov–Mar) = 15:35 UTC  →  cron: "35 15 * * 1"
# Both crons fire every Monday; a Python time gate passes the run that lands
# in the 10:00 AM – 1:00 PM ET window and suppresses the opposing-DST-season
# duplicate. The 180-minute window absorbs GitHub scheduler drift
# (historically up to ~103 minutes). Manual dispatches bypass the gate.
#
# Execution order:
#   Part 0  → Part 0b* → Part 0c* → Part 6 → Part 1
#   → Part 2 → Part 2b* → Part 2a* → Part 3 → Part 9
#   (* optional / non-blocking)
#
# Secrets required (Settings → Secrets → Actions):
#   FRED_API_KEY      free at https://fred.stlouisfed.org/docs/api/api_key.html
#   EIA_API_KEY       free at https://www.eia.gov/opendata/register.php
#   COLLECTAPI_KEY    free at https://collectapi.com
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "35 14 * * 1"   # 10:35 AM EDT (UTC-4, summer)
    - cron: "35 15 * * 1"   # 10:35 AM EST (UTC-5, winter)
  workflow_dispatch:
    inputs:
      retrain:
        description: "Force full model retraining (re-fit Part 2 from scratch)"
        required: false
        default: false
        type: boolean
      skip_lstm:
        description: "Skip Part 2a LSTM sleeve (faster run)"
        required: false
        default: false
        type: boolean
      skip_collectapi:
        description: "Skip Part 0b CollectAPI live prices"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Never cancel a running forecast — always let it finish. Shared with
  # weekly-backfill.yml so the two workflows queue instead of racing on
  # prediction_log.csv and the attribution artifacts.
  group: gas-price-production
  cancel-in-progress: false

env:
  GASPRICE_ROOT: ${{ github.workspace }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
  COLLECTAPI_KEY: ${{ secrets.COLLECTAPI_KEY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  forecast:
    name: Run weekly forecast pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Gate key consistency guard ────────────────────────────────────
      # REQUIRED: the gate step writes exactly one output key ("run"). Every
      # downstream if: condition must reference that same key via
      # steps.gate.outputs.<key>. A mismatch makes those conditions evaluate
      # as empty-string (falsy), silently skipping the pipeline while the
      # workflow exits green — the silent-skip failure mode documented in the
      # reference project's April 2026 audit. This step greps the workflow
      # file at runtime and fails loudly before the gate runs if they disagree.
      - name: Verify gate output key is consistent throughout workflow
        run: |
          WORKFLOW_FILE="${GITHUB_WORKSPACE}/$(echo "${GITHUB_WORKFLOW_REF}" | sed 's|[^/]*/[^/]*/||; s|@.*||')"

          WRITTEN_KEY=$(grep -oP '(?<=f\.write\(")[a-z_]+(?==)' "$WORKFLOW_FILE" | head -1)
          if [ -z "$WRITTEN_KEY" ]; then
            echo "ERROR: Could not extract gate output key from $WORKFLOW_FILE"
            exit 1
          fi
          echo "Gate writes output key: '${WRITTEN_KEY}'"

          CORRECT=$(grep -c "steps\.gate\.outputs\.${WRITTEN_KEY}" "$WORKFLOW_FILE" || true)
          WRONG=$(grep -cP "steps\.gate\.outputs\.(?!${WRITTEN_KEY})[a-z_]+" "$WORKFLOW_FILE" || true)

          echo "Downstream conditions using '${WRITTEN_KEY}': ${CORRECT}"
          echo "Downstream conditions using a different key:  ${WRONG}"

          if [ "$WRONG" -ne 0 ]; then
            echo ""
            echo "FATAL: gate output key mismatch — downstream steps will be silently skipped."
            grep -nP "steps\.gate\.outputs\." "$WORKFLOW_FILE"
            exit 1
          fi
          echo "OK: gate key '${WRITTEN_KEY}' is consistent throughout the workflow."

      # ── 5. Time gate ─────────────────────────────────────────────────────
      # Both crons fire every Monday; the gate passes the one that lands in
      # the 10:00 AM – 1:00 PM ET window (typically the summer cron in EDT
      # months, the winter cron in EST months) and suppresses the duplicate.
      # Manual dispatches (workflow_dispatch) always proceed immediately.
      - name: Check run window (10:00 AM - 1:00 PM ET, Mondays)
        id: gate
        run: |
          python - <<'PYEOF'
          import sys, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              print("Manual dispatch — skipping time gate.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("run=true\n")
              sys.exit(0)

          now = datetime.now(ZoneInfo("America/New_York"))
          hour, minute, weekday = now.hour, now.minute, now.weekday()

          # Monday only, 10:00 AM - 1:00 PM ET: covers the 10:35 nominal
          # trigger with generous room for GitHub scheduler drift.
          in_window = (weekday == 0) and (10 <= hour < 13)
          print(f"NY time: {now.strftime('%H:%M')} weekday={weekday} in_window={in_window}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if in_window else 'false'}\n")

          if not in_window:
              print("Outside Monday 10:00 AM - 1:00 PM ET window — skipping run.")
          PYEOF

      # ── 6. Restore accumulated artifacts from remote ─────────────────────
      # Pulls the prediction log, trained models, and live attribution history
      # committed by previous weekly runs. actions/checkout gives a snapshot
      # of the commit at checkout time; the authoritative copies of the
      # accumulating artifacts live on the remote. Without this step a run
      # following a partial or mis-sequenced push could append to a stale or
      # empty history (PriceCall Finding C pattern).
      - name: Restore accumulated artifacts from remote
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --quiet || true

          for path in \
            artifacts_part3/prediction_log.csv \
            artifacts_part3/gas_part3_summary.json \
            artifacts_part3/gas_fusion_tape.parquet \
            artifacts_part2/gas_part2_models.pkl \
            artifacts_part2/gas_part2_summary.json \
            artifacts_part2b/gas_xgb_models.pkl \
            artifacts_part2b/gas_part2b_summary.json \
            artifacts_part2a/gas_lstm_model.pt \
            artifacts_part2a/gas_part2a_summary.json \
            artifacts_part6/gas_regime_model.pkl \
            artifacts_part6/gas_regime_meta.json \
            artifacts_part6/gas_regime_tape.parquet \
            artifacts_part9/live_attribution_report.json \
            artifacts_part9/live_attribution_tape.csv
          do
            git checkout "origin/${GITHUB_REF_NAME}" -- "$path" 2>/dev/null \
              && echo "Restored: $path" \
              || echo "Not yet in repo (first run?): $path"
          done

      # ── 7. Decide run arguments ──────────────────────────────────────────
      - name: Decide run arguments
        id: args
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          ARGS="--force"

          RETRAIN="${{ github.event.inputs.retrain || 'false' }}"
          if [ "$RETRAIN" = "true" ]; then
            ARGS="$ARGS --retrain"
            echo "Flag: --retrain (forced full retraining)"
          fi

          SKIP_LSTM="${{ github.event.inputs.skip_lstm || 'false' }}"
          if [ "$SKIP_LSTM" = "true" ]; then
            ARGS="$ARGS --skip-lstm"
            echo "Flag: --skip-lstm"
          fi

          SKIP_COLLECTAPI="${{ github.event.inputs.skip_collectapi || 'false' }}"
          if [ "$SKIP_COLLECTAPI" = "true" ]; then
            ARGS="$ARGS --skip-collectapi"
            echo "Flag: --skip-collectapi"
          fi

          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "Run arguments: ${ARGS}"

      # ── 8. Validate API keys ─────────────────────────────────────────────
      - name: Validate API key presence
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "=== API KEY AUDIT ==="
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY is not set. This key is required."
            echo "Add it at: Settings → Secrets → Actions → New repository secret"
            exit 1
          else
            echo "FRED_API_KEY:   set"
          fi

          if [ -z "$EIA_API_KEY" ]; then
            echo "::warning::EIA_API_KEY not set — Part 0c EIA direct data will be skipped."
          else
            echo "EIA_API_KEY:    set"
          fi

          if [ -z "$COLLECTAPI_KEY" ]; then
            echo "::warning::COLLECTAPI_KEY not set — Part 0b live regional prices will be skipped."
          else
            echo "COLLECTAPI_KEY: set"
          fi

      # ── 9. Create artifact directories ───────────────────────────────────
      - name: Create artifact directories
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p \
            artifacts_part0 \
            artifacts_part1 \
            artifacts_part2 \
            artifacts_part2a \
            artifacts_part2b \
            artifacts_part3 \
            artifacts_part6 \
            artifacts_part9 \
            logs

      # ── 10. Run the full pipeline ────────────────────────────────────────
      - name: Run weekly pipeline
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python gas_run_weekly_prediction.py ${{ steps.args.outputs.args }}

      # ── 11. Verify required artifacts ────────────────────────────────────
      - name: Verify required artifacts
        id: verify
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "=== ARTIFACT VERIFICATION ==="
          missing=0

          for path in \
            artifacts_part0/part0_summary.json \
            artifacts_part0/gas_weekly_master.parquet \
            artifacts_part1/gas_feature_matrix.parquet \
            artifacts_part1/part1_summary.json \
            artifacts_part2/gas_forecast_tape.parquet \
            artifacts_part2/gas_part2_summary.json \
            artifacts_part3/prediction_log.csv \
            artifacts_part3/gas_part3_summary.json \
            artifacts_part3/gas_fusion_tape.parquet \
            artifacts_part6/gas_regime_meta.json \
            artifacts_part6/gas_regime_tape.parquet \
            artifacts_part9/live_attribution_report.json
          do
            if [ -f "$path" ]; then
              echo "  OK:      $path"
            else
              echo "  MISSING: $path"
              missing=$((missing + 1))
            fi
          done

          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Required missing: $missing"

      # ── 12. Fail if required artifacts are missing ───────────────────────
      - name: Fail if required artifacts are missing
        if: >
          (steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch') &&
          steps.verify.outputs.missing != '0'
        run: |
          echo "::error::${{ steps.verify.outputs.missing }} required artifact(s) missing."
          echo "The pipeline did not produce all expected outputs."
          echo "Check the 'Run weekly pipeline' step logs above for errors."
          exit 1

      # ── 13. Print forecast summary ───────────────────────────────────────
      - name: Print forecast summary
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "=== LATEST WEEKLY FORECAST ==="
          python - <<'EOF'
          import json, os
          from pathlib import Path

          root = os.environ.get("GASPRICE_ROOT", ".")

          def money(v):
              # FIX (Audit 2026-08): the previous f-string applied :.3f to the
              # 'N/A' fallback string and crashed the summary step whenever a
              # field was missing. Guard the numeric formats.
              try:
                  return f"${float(v):.3f}/gal"
              except (TypeError, ValueError):
                  return "N/A"

          summary_path = Path(root) / "artifacts_part3" / "gas_part3_summary.json"
          if summary_path.exists():
              with open(summary_path) as f:
                  s = json.load(f)
              pred = s.get("latest_prediction", {})
              weights = s.get("fusion_weights", {})
              print(f"  Decision date:   {pred.get('decision_date', 'N/A')}")
              print(f"  Anchor week:     {pred.get('anchor_week', 'N/A')}")
              print(f"  Target date:     {pred.get('target_date', 'N/A')}")
              print(f"  Live forecast:   {bool(pred.get('is_live_forecast', 0))}")
              print(f"  Fusion forecast: {money(pred.get('pred_fusion'))}")
              print(f"  Confidence:      {pred.get('confidence', 'N/A')}")
              print(f"  Regime:          {pred.get('regime', 'N/A')}")
              print(f"  Active sleeves:  {s.get('active_sleeves', [])}")
              print(f"  Fusion weights:  {weights}")
          else:
              print("  Part 3 summary not found.")

          print("")
          print("=== MODEL HEALTH ===")
          report_path = Path(root) / "artifacts_part9" / "live_attribution_report.json"
          if report_path.exists():
              with open(report_path) as f:
                  r = json.load(f)
              health = r.get("model_health", {})
              m = r.get("all_time_metrics", {})
              dm = r.get("diebold_mariano", {})
              print(f"  Health status:  {health.get('health_status', r.get('health_status', 'N/A'))}")
              print(f"  Realized obs:   {r.get('n_realized', 0)}")
              if m.get("mae") is not None:  print(f"  All-time MAE:   {money(m['mae'])}")
              if m.get("mape") is not None: print(f"  All-time MAPE:  {m['mape']:.2f}%")
              if m.get("dir_acc") is not None: print(f"  Direction acc:  {m['dir_acc']:.1%}")
              print(f"  DM test:        {dm.get('dm_interpretation', 'N/A')}")
              print(f"  Recommendation: {health.get('recommendation', 'N/A')}")
          else:
              print("  Attribution report not found.")
          EOF

      # ── 14. Stage dashboard data ─────────────────────────────────────────
      # The dashboard (index.html) fetches flat filenames from the site root:
      # gas_part2_summary.json, gas_part3_summary.json, prediction_log.csv,
      # etc. Copy them into data/ so pages.yml can serve them. Without this
      # step the dashboard 404s on every data file (Audit 2026-08 finding).
      - name: Stage dashboard data
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p data
          for f in \
            artifacts_part2/gas_part2_summary.json \
            artifacts_part2b/gas_part2b_summary.json \
            artifacts_part2a/gas_part2a_summary.json \
            artifacts_part3/gas_part3_summary.json \
            artifacts_part3/prediction_log.csv \
            artifacts_part6/gas_regime_meta.json \
            artifacts_part9/live_attribution_report.json
          do
            [ -f "$f" ] && cp "$f" data/ && echo "Staged: $f" \
              || echo "Not present (skipped): $f"
          done

      # ── 15. Commit and push all forecast artifacts ───────────────────────
      # NOTE: no [skip ci] here — this commit is what triggers pages.yml to
      # redeploy the dashboard (mirrors the PriceCall S60 F1 fix). The
      # backfill workflow keeps [skip ci] intentionally.
      - name: Commit and push forecast artifacts
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all artifact directories, forcing past .gitignore
          git add -f \
            artifacts_part0/ \
            artifacts_part1/ \
            artifacts_part2/ \
            artifacts_part3/ \
            artifacts_part6/ \
            artifacts_part9/ \
            data/ || true

          # Optional sleeve dirs — only exist when sleeves ran
          git add -f artifacts_part2b/ 2>/dev/null || true
          git add -f artifacts_part2a/ 2>/dev/null || true

          # Exit cleanly if nothing changed
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          TODAY="$(date -u '+%Y-%m-%d')"
          git commit -m "Weekly gas price forecast artifacts — ${TODAY}"

          # Pull with ours strategy so concurrent writes don't conflict
          git pull origin "${GITHUB_REF_NAME}" \
            --no-rebase \
            --strategy-option=ours \
            --no-edit || true

          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "Artifacts committed and pushed."

      # ── 16. Upload artifacts to GitHub Actions UI ────────────────────────
      # Kept as a secondary backup; the primary record is the git commit above.
      - name: Upload artifacts to GitHub Actions UI
        uses: actions/upload-artifact@v4
        if: always() && (steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        with:
          name: gas-forecast-${{ github.run_id }}
          retention-days: 90
          path: |
            artifacts_part3/prediction_log.csv
            artifacts_part3/gas_part3_summary.json
            artifacts_part3/gas_fusion_tape.csv
            artifacts_part9/live_attribution_report.json
            artifacts_part9/live_attribution_tape.csv
            artifacts_part2/gas_part2_summary.json
            artifacts_part2b/gas_part2b_summary.json
            artifacts_part2a/gas_part2a_summary.json
            artifacts_part6/gas_regime_meta.json
