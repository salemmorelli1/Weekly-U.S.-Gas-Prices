name: Weekly Gas Price Forecast

on:
  schedule:
    # EIA normally publishes Monday observations on Tuesday around 10 a.m. ET.
    # Wednesday is a holiday/delay fallback and is idempotently suppressed
    # when Tuesday already published the current Monday observation.
    - cron: "30 11 * * 2"
      timezone: "America/New_York"
    - cron: "30 11 * * 3"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Acknowledge full model retraining"
        required: false
        default: false
        type: boolean
      skip_lstm:
        description: "Skip the optional LSTM sleeve"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: gas-price-production
  cancel-in-progress: false

env:
  GASPRICE_ROOT: ${{ github.workspace }}
  GASPRICE_PIPELINE_RUN_ID: ${{ github.run_id }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  forecast:
    name: Run release-aware weekly pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Decide whether this release needs publication
        id: release
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should_run = True
          reason = "manual dispatch"
          schedule = os.environ.get("SCHEDULE_EXPRESSION", "")
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and schedule.endswith("* * 3"):
              today = datetime.now(ZoneInfo("America/New_York")).date()
              current_monday = today - timedelta(days=today.weekday())
              status_path = Path("artifacts_part3/pipeline_status.json")
              if status_path.exists():
                  status = json.loads(status_path.read_text(encoding="utf-8"))
                  already_current = (
                      status.get("status") == "SUCCESS"
                      and status.get("source_observation_date") == current_monday.isoformat()
                  )
                  if already_current:
                      should_run = False
                      reason = f"Tuesday already published {current_monday}"
                  else:
                      reason = f"Wednesday fallback for {current_monday}"
              else:
                  reason = f"Wednesday fallback for {current_monday}; no status exists"
          elif os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              reason = "normal Tuesday release"

          print(f"should_run={should_run}: {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if should_run else 'false'}\n")
              handle.write(f"reason={reason}\n")
          PY

      - name: Set up Python 3.12
        if: steps.release.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-production-lock.txt

      - name: Install locked production dependencies
        if: steps.release.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-production-lock.txt

      - name: Validate API credentials
        if: steps.release.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -z "${FRED_API_KEY}" ]; then
            echo "::error::FRED_API_KEY is required for GASREGCOVW."
            exit 1
          fi
          if [ -z "${EIA_API_KEY}" ]; then
            echo "::warning::EIA_API_KEY is absent; optional Part 0c will publish an empty current-run summary."
          fi

      - name: Run weekly pipeline
        if: steps.release.outputs.run == 'true'
        run: |
          set -euo pipefail
          args=(--force)
          if [ "${{ github.event.inputs.retrain || 'false' }}" = "true" ]; then
            args+=(--retrain)
          fi
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.skip_lstm }}" = "true" ]; then
            args+=(--skip-lstm)
          fi
          python gas_run_weekly_prediction.py "${args[@]}"

      - name: Stage and verify release ledger
        if: steps.release.outputs.run == 'true'
        run: |
          set -euo pipefail
          python gas_release_manifest.py stage
          python gas_release_manifest.py verify

      - name: Verify strict JSON publication files
        if: steps.release.outputs.run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def reject(token):
              raise ValueError(f"non-standard JSON constant: {token}")

          for path in sorted(Path("data").glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle, parse_constant=reject)
              print(f"strict JSON: {path}")
          PY

      - name: Upload immutable research evidence
        if: steps.release.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gas-price-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            artifacts_part0/
            artifacts_part1/
            artifacts_part2/
            artifacts_part2a/
            artifacts_part2b/
            artifacts_part3/
            artifacts_part6/
            artifacts_part9/
            data/release_manifest.json

      - name: Commit reviewable publication surface
        id: publish
        if: steps.release.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          paths=(
            artifacts_part0/part0_summary.json
            artifacts_part0/part0c_summary.json
            artifacts_part1/part1_summary.json
            artifacts_part2/gas_part2_summary.json
            artifacts_part2/gas_forecast_tape.csv
            artifacts_part2/gas_oof_predictions.csv
            artifacts_part3/gas_part3_summary.json
            artifacts_part3/pipeline_status.json
            artifacts_part3/prediction_log.csv
            artifacts_part6/gas_regime_meta.json
            artifacts_part9/live_attribution_report.json
            artifacts_part9/live_attribution_tape.csv
            data
          )
          for optional in \
            artifacts_part2a/gas_part2a_summary.json \
            artifacts_part2b/gas_part2b_summary.json
          do
            if [ -f "$optional" ]; then paths+=("$optional"); fi
          done
          git add -f -- "${paths[@]}"

          if git diff --cached --quiet; then
            echo "No publication changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Publish weekly gas forecast release ledger (${{ github.run_id }})"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase --autostash "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy committed release to Pages
        if: steps.publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Report idempotent skip
        if: steps.release.outputs.run != 'true'
        run: echo "No pipeline run required — ${{ steps.release.outputs.reason }}."
